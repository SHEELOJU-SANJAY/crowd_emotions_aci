name: Deploy Crowd_Emotions to Azure Container Instances

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository code
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Log in to Docker Hub
      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      # Step 3: Build Docker image
      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/crowd_emotions:latest .

      # Step 4: Push image to Docker Hub
      - name: Push image to Docker Hub
        run: docker push ${{ secrets.DOCKER_USERNAME }}/crowd_emotions:latest

      # Step 5: Log in to Azure using Service Principal credentials
      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Step 6: Deploy to Azure Container Instances (ACI)
      - name: Deploy to Azure Container Instances
        uses: azure/aci-deploy@v1
        with:
          resource-group: crowd-emotions-rg
          name: crowd-emotions-container
          image: ${{ secrets.DOCKER_USERNAME }}/crowd_emotions:latest
          dns-name-label: crowd-emotions-${{ github.run_number }}
          location: eastus              # REQUIRED - Azure region where ACI will be deployed
          ports: 8080                   # Expose port 8080
          cpu: 1                        # Allocate 1 vCPU
          memory: 1.5                   # Allocate 1.5 GB of RAM
          os-type: Linux                # Linux container
          ip-address: Public            # Public IP (so you can access via browser)
          protocol: TCP                 # TCP protocol for port 8080
          restart-policy: Always        # Restart container automatically if it stops
